<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NALARKA - Affiliate Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-indigo-400 tracking-wider">NALARKA</h1>
            <p class="text-slate-400 text-sm mt-1">Affiliate Script & Prompt Generator Tool</p>
        </div>

        <!-- Form Input -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Nama Produk</label>
                <input type="text" id="productName" placeholder="Contoh: Sepatu Lari Lightweight" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Keunggulan Utama / Fitur</label>
                <textarea id="productFeatures" rows="3" placeholder="Contoh: Ringan, empuk, bahan waterproof, cocok buat pemula" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition"></textarea>
            </div>

            <button onclick="generateScript()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
                Buat Script Affiliate
            </button>
        </div>

        <!-- Hasil Output -->
        <div id="outputContainer" class="mt-6 hidden">
            <label class="block text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-2">Hasil Script Video (Tiktok/Reels/Shorts)</label>
            <div id="scriptOutput" class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-slate-300 text-sm whitespace-pre-line leading-relaxed"></div>
            <button onclick="copyToClipboard()" class="mt-3 w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2.5 rounded-lg border border-slate-700 transition">
                📋 Salin Teks
            </button>
        </div>
    </div>

    <script>
        function generateScript() {
            const name = document.getElementById('productName').value;
            const features = document.getElementById('productFeatures').value;
            const outputContainer = document.getElementById('outputContainer');
            const scriptOutput = document.getElementById('scriptOutput');

            if (!name || !features) {
                alert('Silakan isi nama produk dan keunggulannya terlebih dahulu!');
                return;
            }

            const generatedText = `🔥 **HOOOK (3 Detik Pertama)**\n"Jangan beli ${name} sebelum kamu tahu hal ini!"\n\n💡 **PROBLEM & SOLUSI**\n"Lagi cari produk yang pas tapi sering kecewa? Nah, ini dia solusinya. ${name} hadir khusus buat kamu yang butuh kenyamanan maksimal."\n\n✨ **KEUNGGULAN PRODUK**\n${features}\n\n🛒 **CALL TO ACTION**\n"Penasaran sama promonya? Langsung klik keranjang kuning / link di bio sekarang juga sebelum kehabisan!"`;

            scriptOutput.innerText = generatedText;
            outputContainer.classList.remove('hidden');
        }

        function copyToClipboard() {
            const text = document.getElementById('scriptOutput').innerText;
            navigator.clipboard.writeText(text);
            alert('Script berhasil disalin!');
        }
    </script>
</body>
</html>
